<div>

  <h2>Hotel Overview</h2>

  <p>
    <strong>Hotel:</strong>
    {{ hotel.name }}
  </p>

  <p>
    <strong>Provider:</strong>
    {{ hotel.provider }}
  </p>

  <p>
    <strong>Location:</strong>
    {{ hotel.basicInfo.location }}

  <p>
    <strong>Hotel Type:</strong>
    {{ hotel.basicInfo.hotelType }}

  <p>
    <strong>Currency:</strong>
    {{ hotel.basicInfo.defaultCurrency }}

</div>
